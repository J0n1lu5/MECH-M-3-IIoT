[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; settings.toml liegt im Ordner data/ und wird mit `pio run -t uploadfs` aufgespielt
board_build.filesystem = littlefs
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7
  adafruit/DHT sensor library@^1.4
  adafruit/Adafruit Unified Sensor@^1.1

; Erzeugt data/settings.toml aus der .env im Hauptverzeichnis (siehe load_env.py)
extra_scripts = pre:load_env.py
